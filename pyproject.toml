[project]
name = "specvania"
version = "0.1.0"
description = "A spec-driven coding agent where your spec becomes a metroidvania map."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
specvania = "specvania.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "pyright>=1.1"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: requires the configured Postgres test ledger"]
