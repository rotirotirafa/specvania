<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-i18n="app.name"></title>
  <style>
    @font-face {
      font-family: "Press Start 2P";
      src: url("./vendor/fonts/PressStart2P-Regular.ttf") format("truetype");
      font-display: swap;
    }
    body { margin: 0; background: var(--background); color: var(--text);
      font: 10px/1.8 "Press Start 2P", monospace; }
    #desktop-title-bar { position: fixed; left: 0; right: 0; top: 0; z-index: 2; }
    main { position: fixed; right: 12px; top: 32px; width: 240px;
      max-height: calc(100vh - 44px); overflow: auto; z-index: 1;
      background: var(--surface); border: 2px solid var(--border); padding: 8px; }
    h1 { font-size: 10px; color: var(--accent); }
    #world-map { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    canvas { image-rendering: pixelated; display: block; }
    main p { margin: 4px 0; }
    main h2, main h3 { font-size: 8px; margin: 6px 0; }
    #screen-host[data-screen=idea] { right: 284px; background: transparent; align-items: end; pointer-events: none; overflow: hidden; }
    #screen-host[data-screen=idea] .screen-panel { pointer-events: auto; margin: auto auto 0; }
    .mage-dialogue { box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 4px solid var(--border); padding: 12px; text-align: left; font: 10px/1.5 "Press Start 2P", monospace; max-height: calc(100vh - 64px); overflow: hidden; }
    .dialogue-speaker { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    #screen-host .dialogue-speaker h2 { font-size: 10px; margin: 0; }
    .dialogue-content { min-height: 0; overflow: auto; }
    .dialogue-actions { display: flex; justify-content: end; gap: 8px; flex-shrink: 0; }
    #screen-host .mage-dialogue p { margin: 4px 0; }
    #screen-host .mage-dialogue button { min-height: 32px; margin: 0; padding: 8px; }
    #screen-host .mage-dialogue label { margin: 4px 0; }
    #screen-host[data-screen=idea][data-dialogue=world] .screen-panel { width: 100%; }
    .mage-dialogue[data-mode=world] { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; height: 72px; padding: 8px; }
    .mage-dialogue[data-mode=world] .dialogue-speaker h2 { display: none; }
    .mage-dialogue[data-mode=world] .dialogue-content { overflow: hidden; }
    .mage-dialogue[data-mode=world] p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #screen-host textarea { box-sizing: border-box; width: 100%; font: inherit; color: var(--text); background: var(--background); border: 2px solid var(--border); padding: 8px; min-height: 48px; max-height: 96px; resize: vertical; }
    #screen-host[data-screen=idea] label { display: block; }
    #screen-host[data-screen=idea] [role=option] { display: block; width: 100%; margin: 4px 0; padding: 6px; text-align: left; }
    #map-rooms { white-space: pre-wrap; }
    .expedition-dialog { position: fixed; z-index: 5; inset: 48px 48px 16px; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 12px; padding: 16px; box-shadow: 4px 4px var(--background); }
    .expedition-content { flex: 1; min-height: 0; overflow: auto; overflow-wrap: anywhere; }
    .expedition-content h2 { font-size: 16px; color: var(--accent); margin: 8px 0 16px; }
    .expedition-content p { margin: 8px 0; }
    .expedition-content pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
    .expedition-actions { display: flex; flex-shrink: 0; gap: 12px; justify-content: end; }
    .expedition-dialog button { font: inherit; color: var(--text); background: var(--background);
      border: 2px solid var(--accent); padding: 12px; min-height: 40px; cursor: pointer; }
    .expedition-dialog button:disabled { opacity: 0.6; cursor: default; }
    #approval-choice .expedition-actions { align-items: center; }
    #approval-choice label { max-width: 240px; }
    #approval-choice input { flex: 1; min-width: 0; box-sizing: border-box; font: inherit;
      color: var(--text); background: var(--background); border: 2px solid var(--border); padding: 8px; min-height: 40px; }
    #approval-choice input:disabled { opacity: 0.6; }
    .expedition-dialog [hidden] { display: none; }
    .expedition-dialog :focus-visible, .expedition-dialog:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .expedition-dialog[data-screen=end] { inset: 48px 24px 16px; }
    .end-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .end-metrics > div { border: 2px solid var(--border); padding: 8px; }
    .end-metrics p { color: var(--muted); font-size: 8px; }
    .end-metrics strong { font-size: 14px; }
    .end-commits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .boss-dialog { border: 0 !important; box-shadow: none; }
    .boss-dialog .expedition-content { flex: 0 0 auto; max-height: 180px; background: var(--surface); border: 4px solid var(--border); padding: 8px 16px; }
    .boss-dialog .expedition-content > span { float: left; margin-right: 12px; }
    .boss-dialog .expedition-content h2 { margin: 0; }
    .boss-dialog .expedition-actions { margin-top: auto; }
    .boss-hp { display: flex; gap: 4px; flex-wrap: wrap; }
    .boss-hp span { background: var(--accent); color: var(--background); border: 2px solid var(--text); padding: 4px 8px; }
    .boss-hp [data-passed=true] { background: var(--background); color: var(--muted); border-color: var(--muted); text-decoration: line-through; }
    .boss-dialog[data-transition=true] { animation: arena-enter 240ms steps(4, end); }
    @keyframes arena-enter { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .boss-dialog { animation: none !important; } }
    #replay-bar { position: fixed; z-index: 8; top: 32px; left: 12px; max-width: calc(100vw - 32px); box-sizing: border-box; border: 2px solid; padding: 8px; }
    #replay-bar[hidden] { display: none; }
    #replay-bar p { margin: 0 0 4px; font-size: 8px; }
    #replay-bar button { font: inherit; color: var(--text); background: var(--background); border: 2px solid var(--border); margin: 2px; padding: 8px; cursor: pointer; }
    #replay-bar [aria-pressed=true] { border-color: var(--accent); }
    #replay-bar :focus-visible { outline: 3px solid var(--accent); }
    #replay-dialogue { position: fixed; z-index: 4; left: 16px; right: 284px; bottom: 16px; max-height: calc(100vh - 160px); }
    #replay-dialogue [aria-selected=true] { color: var(--accent); }
    @media (max-width: 640px) { .expedition-dialog { inset: 40px 8px 8px; padding: 8px; }
      .end-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .expedition-actions { gap: 4px; } .expedition-dialog button { padding: 8px; } }

  </style>
</head>
<body>
  <div id="world-map" role="img" data-i18n-aria="map.description"></div>
  <section id="screen-host" hidden></section>
  <main id="castle-hud" aria-live="polite">
    <h1 data-i18n="app.name"></h1>
    <p id="connection"></p>
    <p id="run-state"></p>
    <p data-i18n="map.hint"></p>
    <details><summary data-i18n="map.rooms"></summary><p id="map-rooms"></p></details>
  </main>
  <script src="./vendor/phaser.min.js" data-version="3.90.0"
    integrity="sha256-6S3e8RG6QuktMWl5xzIxF1cJNojqGBBZHLeqKFjrp6c="></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
