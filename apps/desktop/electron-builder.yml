{
  "appId": "specvania",
  "productName": "specvania",
  "directories": {
    "output": "dist",
    "buildResources": "build"
  },
  "files": [
    "main.js",
    "preload.js",
    "studio.cjs",
    "build/icon.png",
    {
      "from": "../../src/specvania/ui/static",
      "to": "static",
      "filter": [
        "i18n/**",
        "pixel/palette.js",
        "pixel/cast.js",
        "screens/**",
        "vendor/fonts/**",
        "vendor/kenney-tiny-dungeon/**"
      ]
    }
  ],
  "artifactName": "specvania-${version}-${arch}.${ext}",
  "mac": {
    "target": [
      "dmg"
    ],
    "identity": null,
    "icon": "build/icon.png",
    "extraResources": [
      {
        "from": "build/runtime/darwin-${arch}",
        "to": "runtime",
        "filter": [
          "**/*"
        ]
      }
    ]
  },
  "linux": {
    "target": [
      "AppImage"
    ],
    "icon": "build/icon.png",
    "executableName": "specvania-desktop",
    "category": "Development",
    "extraResources": [
      {
        "from": "build/runtime/linux-${arch}",
        "to": "runtime",
        "filter": [
          "**/*"
        ]
      }
    ]
  },
  "dmg": {
    "format": "UDZO"
  },
  "afterPack": "scripts/verify-runtime.cjs"
}
