# Optional team/test ledger. These credentials are for local development only.
# Bind only to loopback; never use these credentials on a public server.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: specvania
      POSTGRES_PASSWORD: specvania
      POSTGRES_DB: specvania
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specvania -d specvania"]
      interval: 2s
      timeout: 5s
      retries: 30
