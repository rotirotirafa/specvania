{
  "name": "CI",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "wheel": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "name": "actions/checkout v4.4.0",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e",
          "with": {
            "python-version": "3.12"
          },
          "name": "astral-sh/setup-uv v6.8.0"
        },
        {
          "name": "Install test tools",
          "run": "uv sync --locked"
        },
        {
          "name": "Build wheel",
          "run": "uv build"
        },
        {
          "name": "Inspect bundled resources",
          "run": "uv run pytest -q tests/test_e2e.py tests/test_wheel.py -k built_wheel"
        },
        {
          "name": "Wheel CLI smoke test",
          "run": "uvx --from dist/*.whl specvania replay demo --help"
        },
        {
          "name": "actions/upload-artifact v4.6.2",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "python-dist",
            "path": "dist/*.tar.gz\ndist/*.whl",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "postgres-e2e": {
      "runs-on": "ubuntu-latest",
      "env": {
        "SPECVANIA_TEST_DATABASE_URL": "postgresql+psycopg://specvania:specvania@localhost:5432/specvania"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "name": "actions/checkout v4.4.0",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e",
          "with": {
            "python-version": "3.12"
          },
          "name": "astral-sh/setup-uv v6.8.0"
        },
        {
          "name": "Start optional ledger",
          "run": "docker compose up -d --wait postgres"
        },
        {
          "name": "Install Postgres extra",
          "run": "uv sync --locked --extra postgres"
        },
        {
          "name": "G9 \u00b7 CLI end-to-end",
          "run": "uv run pytest -q -rs tests/test_e2e.py"
        },
        {
          "name": "Stop ledger",
          "if": "always()",
          "run": "docker compose down"
        }
      ]
    },
    "postgres": {
      "runs-on": "ubuntu-latest",
      "env": {
        "SPECVANIA_TEST_DATABASE_URL": "postgresql+psycopg://specvania:specvania@localhost:5432/specvania"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "name": "actions/checkout v4.4.0",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e",
          "with": {
            "python-version": "3.12"
          },
          "name": "astral-sh/setup-uv v6.8.0"
        },
        {
          "name": "Install Postgres extra",
          "run": "uv sync --locked --extra postgres"
        },
        {
          "name": "Start optional ledger",
          "run": "docker compose up -d --wait postgres"
        },
        {
          "name": "G9 \u00b7 Ledger contract",
          "run": "uv run pytest -q -rs tests/test_ledger.py"
        },
        {
          "name": "Stop ledger",
          "if": "always()",
          "run": "docker compose down"
        }
      ]
    },
    "desktop-check": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "name": "actions/checkout v4.4.0",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22"
          },
          "name": "actions/setup-node v4.4.0"
        },
        {
          "name": "G10 \u00b7 Desktop check",
          "run": "npm --prefix apps/desktop run check"
        }
      ]
    },
    "checks": {
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-latest",
            "macos-latest"
          ],
          "python-version": [
            "3.12",
            "3.13"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "name": "actions/checkout v4.4.0",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e",
          "with": {
            "python-version": "${{ matrix.python-version }}"
          },
          "name": "astral-sh/setup-uv v6.8.0"
        },
        {
          "name": "Install",
          "run": "uv sync --locked"
        },
        {
          "name": "G1 \u00b7 Lint",
          "run": "uv run ruff check ."
        },
        {
          "name": "G2 \u00b7 Format",
          "run": "uv run ruff format --check ."
        },
        {
          "name": "G3 \u00b7 Types",
          "run": "uv run pyright"
        },
        {
          "name": "G4 \u00b7 Tests",
          "run": "uv run pytest -q"
        }
      ]
    },
    "build-desktop": {
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "os": "macos-15",
              "platform": "mac",
              "arch": "arm64",
              "extension": "dmg",
              "target": "darwin-arm64"
            },
            {
              "os": "macos-15-intel",
              "platform": "mac",
              "arch": "x64",
              "extension": "dmg",
              "target": "darwin-x64"
            },
            {
              "os": "ubuntu-latest",
              "platform": "linux",
              "arch": "x64",
              "extension": "AppImage",
              "target": "linux-x64"
            }
          ]
        }
      },
      "defaults": {
        "run": {
          "working-directory": "apps/desktop"
        }
      },
      "env": {
        "CSC_IDENTITY_AUTO_DISCOVERY": "false"
      },
      "steps": [
        {
          "name": "actions/checkout v4.4.0",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "actions/setup-node v4.4.0",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22",
            "cache": "npm",
            "cache-dependency-path": "apps/desktop/package-lock.json"
          }
        },
        {
          "name": "astral-sh/setup-uv v6.8.0",
          "uses": "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Build runtime wheel",
          "working-directory": "./",
          "run": "uv build --wheel"
        },
        {
          "name": "Export locked runtime dependencies",
          "working-directory": "./",
          "run": "mkdir -p apps/desktop/build\nuv export --frozen --no-dev --no-emit-project --no-hashes --output-file apps/desktop/build/runtime-requirements.txt"
        },
        {
          "name": "Bundle pinned runtime",
          "run": "npm run bundle-runtime -- --target ${{ matrix.target }} --wheel ../../dist/*.whl --requirements build/runtime-requirements.txt"
        },
        {
          "name": "Install pinned desktop dependencies",
          "run": "npm ci"
        },
        {
          "name": "Generate app icon",
          "run": "npm run make-icon"
        },
        {
          "name": "Build unsigned installer without publishing",
          "run": "./node_modules/.bin/electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never"
        },
        {
          "name": "Check compressed dmg size",
          "if": "matrix.platform == 'mac'",
          "run": "node - <<'NODE'\nconst fs = require('node:fs');\nconst files = fs.readdirSync('dist').filter(file => file.endsWith('.dmg'));\nif (!files.length) throw new Error('No dmg artifact was built.');\nfor (const file of files) {\n  const bytes = fs.statSync('dist/' + file).size;\n  if (bytes >= 250000000) throw new Error(file + ' must stay under 250 MB (got ' + bytes + ' bytes).');\n  console.log(file + ': ' + bytes + ' bytes, under 250 MB');\n}\nNODE"
        },
        {
          "name": "actions/upload-artifact v4.6.2",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "desktop-${{ matrix.platform }}-${{ matrix.arch }}",
            "path": "apps/desktop/dist/specvania-*-${{ matrix.arch }}.${{ matrix.extension }}",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
