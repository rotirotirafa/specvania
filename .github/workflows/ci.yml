{
  "name": "CI",
  "on": {"push": {}, "pull_request": {}},
  "permissions": {"contents": "read"},
  "jobs": {
    "wheel": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "astral-sh/setup-uv@v6", "with": {"python-version": "3.12"}},
        {"name": "Install test tools", "run": "uv sync --locked"},
        {"name": "Build wheel", "run": "uv build"},
        {"name": "Inspect bundled resources", "run": "uv run pytest -q tests/test_e2e.py tests/test_wheel.py -k built_wheel"},
        {"name": "Wheel CLI smoke test", "run": "uvx --from dist/*.whl specvania replay demo --help"}
      ]
    },
    "postgres-e2e": {
      "runs-on": "ubuntu-latest",
      "env": {
        "SPECVANIA_TEST_DATABASE_URL": "postgresql+psycopg://specvania:specvania@localhost:5432/specvania"
      },
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "astral-sh/setup-uv@v6", "with": {"python-version": "3.12"}},
        {"name": "Start optional ledger", "run": "docker compose up -d --wait postgres"},
        {"name": "Install Postgres extra", "run": "uv sync --locked --extra postgres"},
        {"name": "G9 · CLI end-to-end", "run": "uv run pytest -q -rs tests/test_e2e.py"},
        {"name": "Stop ledger", "if": "always()", "run": "docker compose down"}
      ]
    },
    "postgres": {
      "runs-on": "ubuntu-latest",
      "env": {
        "SPECVANIA_TEST_DATABASE_URL": "postgresql+psycopg://specvania:specvania@localhost:5432/specvania"
      },
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "astral-sh/setup-uv@v6", "with": {"python-version": "3.12"}},
        {"name": "Install Postgres extra", "run": "uv sync --locked --extra postgres"},
        {"name": "Start optional ledger", "run": "docker compose up -d --wait postgres"},
        {"name": "G9 · Ledger contract", "run": "uv run pytest -q -rs tests/test_ledger.py"},
        {"name": "Stop ledger", "if": "always()", "run": "docker compose down"}
      ]
    },
    "desktop-check": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {"uses": "actions/checkout@v4"},
        {"uses": "actions/setup-node@v4", "with": {"node-version": "22"}},
        {"name": "G10 · Desktop check", "run": "npm --prefix apps/desktop run check"}
      ]
    },
    "checks": {
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": ["ubuntu-latest", "macos-latest"],
          "python-version": ["3.12", "3.13"]
        }
      },
      "steps": [
        {"uses": "actions/checkout@v4"},
        {
          "uses": "astral-sh/setup-uv@v6",
          "with": {"python-version": "${{ matrix.python-version }}"}
        },
        {"name": "Install", "run": "uv sync --locked"},
        {"name": "G1 · Lint", "run": "uv run ruff check ."},
        {"name": "G2 · Format", "run": "uv run ruff format --check ."},
        {"name": "G3 · Types", "run": "uv run pyright"},
        {"name": "G4 · Tests", "run": "uv run pytest -q"}
      ]
    }
  }
}
