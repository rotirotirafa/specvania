[project]
name = "sample-todo-api"
version = "0.1.0"
description = "A small FastAPI project for specvania dogfood runs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn"]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "todo_api"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
